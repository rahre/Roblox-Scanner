services:
  - type: web
    name: roblox-scanner-admin
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python admin/server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: robox-scanner-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: MASTER_KEY
        generateValue: true
